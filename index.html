<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#181313">
  <title>本子工坊 2 · 画风选择</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#171313;color:#f9f2ed;font-family:"Microsoft YaHei","PingFang SC",sans-serif}button,input{font:inherit}
    body{background:radial-gradient(circle at 15% 0,#45251f 0,transparent 34rem),linear-gradient(160deg,#171313,#211817 60%,#161212)}
    .app{width:min(1180px,100%);margin:auto;padding:6px clamp(8px,2vw,20px) 60px}.top{position:sticky;top:0;z-index:9;margin:0 -4px;padding:4px;background:linear-gradient(#1b1515fa,#1b1515e8 88%,transparent);backdrop-filter:blur(14px)}
    .titleline{display:flex;justify-content:flex-end}.actions{display:flex;gap:4px}.btn{min-height:28px;border:1px solid #74544b;background:#2b211f;color:#fff;border-radius:8px;padding:3px 9px;cursor:pointer;white-space:nowrap;font-size:12px}.btn.primary{background:#c34e3d;border-color:#e77a67;font-weight:800}.btn.apply{background:#2e8b67;border-color:#68c9a4;font-weight:900}.btn:active{transform:translateY(1px)}[hidden]{display:none!important}
    .chosen{padding:3px 7px;border:1px solid #604840;border-radius:8px;background:#241b19;display:flex;gap:6px;align-items:center;min-height:28px;overflow:hidden}.chosen-label{white-space:nowrap;color:#efb7a7;font-size:11px;font-weight:800}.chips{display:flex;gap:4px;flex-wrap:nowrap;overflow:auto;scrollbar-width:none}.chip{min-height:22px;border:1px solid #74544b;background:#362622;color:#fff;border-radius:999px;padding:2px 7px;cursor:pointer;white-space:nowrap;font-size:10px}.empty{color:#9e8a83;font-size:10px;white-space:nowrap}
    .tools{display:grid;grid-template-columns:1fr auto;gap:6px;margin:4px 0}.search{width:100%;min-height:30px;border:1px solid #664d46;border-radius:8px;padding:4px 9px;background:#251d1b;color:#fff;outline:none;font-size:12px}.search:focus{border-color:#e27561;box-shadow:0 0 0 2px #e2756122}.count{align-self:center;color:#bca9a2;font-size:10px}
    .tabs{display:flex;gap:4px;overflow:auto;padding:0 0 4px;scrollbar-width:none}.tab{min-height:27px;white-space:nowrap;border:1px solid #5e4740;background:#241c1a;color:#ccb9b1;border-radius:999px;padding:3px 8px;cursor:pointer;font-size:10px}.tab.active{background:#8e352a;color:#fff;border-color:#e06d5b}
    .grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}.card{position:relative;border:2px solid transparent;background:#271e1c;border-radius:16px;overflow:hidden;cursor:pointer;box-shadow:0 10px 28px #0005;transition:.18s transform,.18s border-color}.card:hover{transform:translateY(-3px);border-color:#80564b}.card.active{border-color:#ff8b72;box-shadow:0 0 0 3px #ff78542a,0 12px 30px #0007}.card img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;background:#302624}.card-info{padding:10px 12px 12px}.card b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card small{color:#aa958e}.fav{position:absolute;right:9px;top:9px;width:36px;height:36px;border-radius:50%;border:1px solid #ffffff55;background:#171313c9;color:#d4c3bc;font-size:20px;cursor:pointer}.fav.active{color:#ffd36a;background:#5e3b20e8}.check{position:absolute;left:9px;top:9px;background:#c64d3d;color:white;border-radius:999px;padding:5px 9px;font-weight:900;opacity:0}.card.active .check{opacity:1}.nothing{grid-column:1/-1;text-align:center;padding:70px 10px;color:#a9938b}
    .toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);padding:10px 15px;border:1px solid #916358;background:#251b19f2;border-radius:12px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media(max-width:800px){.top{position:relative}.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.actions{width:auto;margin-left:auto}.chosen{overflow:auto;max-height:34px}.tools{grid-template-columns:1fr}.count{display:none}}
    @media(max-width:520px){.app{padding:0 7px 50px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.card{border-radius:11px}.card-info{padding:7px}.top{margin:0;padding:max(5px,env(safe-area-inset-top)) 0 4px}.titleline{height:30px}.btn{min-height:26px;padding:2px 8px}.chosen{margin-top:2px;min-height:27px;padding:2px 6px}.tools{margin:3px 0}.search{min-height:28px}.tabs{padding-bottom:3px}.fav{width:32px;height:32px}}
    html.picker .top{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(190px,1fr);grid-template-rows:28px 30px;gap:4px;padding:4px}html.picker .titleline{grid-column:1;grid-row:1}html.picker .actions{height:28px}html.picker .chosen{grid-column:2/4;grid-row:1;margin-top:0}html.picker .tools{grid-column:1/3;grid-row:2;margin:0;display:block}html.picker .count{display:none}html.picker .tabs{grid-column:3;grid-row:2;padding:1px 0;align-items:center}html.picker .grid{margin-top:5px}@media(max-width:620px){html.picker .top{grid-template-columns:1fr auto;grid-template-rows:28px 28px 30px}html.picker .titleline{grid-column:1/3;grid-row:1}html.picker .chosen{grid-column:1/3;grid-row:2}html.picker .tools{grid-column:1;grid-row:3}html.picker .tabs{grid-column:2;grid-row:3;max-width:47vw}}
  </style>
</head>
<body>
  <main class="app">
    <header class="top">
      <div class="titleline"><div class="actions"><button class="btn" id="clear">清空</button><button class="btn primary" id="copy">复制</button><button class="btn apply" id="apply" hidden>应用</button></div></div>
      <div class="chosen"><span class="chosen-label">已选 <b id="selectedCount">0</b></span><div class="chips" id="chips"><span class="empty">还没有选择画风</span></div></div>
      <div class="tools"><input class="search" id="search" placeholder="搜索画师名，例如 Hisasi"><span class="count" id="count"></span></div>
      <nav class="tabs" id="tabs"></nav>
    </header>
    <section class="grid" id="grid"></section>
  </main>
  <div class="toast" id="toast"></div>
  <script src="artists.js"></script>
  <script>
    const A=window.ARTISTS||[],K='hbook-style-gallery-v1',params=new URLSearchParams(location.search),pickerMode=params.get('mode')==='picker',pickerNonce=params.get('nonce')||'';document.documentElement.classList.toggle('picker',pickerMode);
    let saved={selected:[],favorites:[],recent:[]};try{saved=Object.assign(saved,JSON.parse(localStorage.getItem(K)||'{}'))}catch(e){}
    let category='all',query='';const $=s=>document.querySelector(s),unique=a=>[...new Set(a)].filter(i=>A[i]);
    function persist(){saved.selected=unique(saved.selected);saved.favorites=unique(saved.favorites);saved.recent=unique(saved.recent).slice(0,18);localStorage.setItem(K,JSON.stringify(saved))}
    function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
    function toast(s){const x=$('#toast');x.textContent=s;x.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>x.classList.remove('show'),1800)}
    function toggle(i){if(saved.selected.includes(i))saved.selected=saved.selected.filter(x=>x!==i);else{saved.selected.push(i);saved.recent=[i,...saved.recent.filter(x=>x!==i)]}persist();render()}
    function favorite(i){saved.favorites=saved.favorites.includes(i)?saved.favorites.filter(x=>x!==i):[i,...saved.favorites];persist();render()}
    function render(){
      const tabs=[['all','全部',A.length],['recent','最近使用',saved.recent.length],['favorites','收藏',saved.favorites.length]];
      $('#tabs').innerHTML=tabs.map(([id,n,c])=>`<button class="tab ${category===id?'active':''}" data-cat="${id}">${n}${pickerMode?'':` · ${c}`}</button>`).join('');
      document.querySelectorAll('.tab').forEach(x=>x.onclick=()=>{category=x.dataset.cat;render()});
      let ids=category==='recent'?saved.recent:category==='favorites'?saved.favorites:A.map((_,i)=>i);ids=ids.filter(i=>A[i].tag.toLowerCase().includes(query));
      $('#count').textContent=`显示 ${ids.length} · 已选 ${saved.selected.length}`;$('#selectedCount').textContent=saved.selected.length;
      $('#chips').innerHTML=saved.selected.length?saved.selected.map(i=>`<button class="chip" data-remove="${i}" title="点击取消">${esc(A[i].tag)} ×</button>`).join(''):'<span class="empty">还没有选择画风</span>';
      document.querySelectorAll('[data-remove]').forEach(x=>x.onclick=()=>toggle(+x.dataset.remove));
      $('#grid').innerHTML=ids.length?ids.map(i=>`<article class="card ${saved.selected.includes(i)?'active':''}" data-i="${i}" tabindex="0"><span class="check">✓ 已选</span><button class="fav ${saved.favorites.includes(i)?'active':''}" data-fav="${i}" title="收藏">★</button><img loading="lazy" src="${A[i].file}" alt="${esc(A[i].tag)} 画风示例"><div class="card-info"><b>${esc(A[i].tag.replace(/^@/,''))}</b><small>STYLE ${String(i+1).padStart(3,'0')}</small></div></article>`).join(''):'<div class="nothing">这里还没有内容</div>';
      document.querySelectorAll('.card').forEach(x=>{x.onclick=e=>{if(!e.target.closest('.fav'))toggle(+x.dataset.i)};x.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle(+x.dataset.i)}}});
      document.querySelectorAll('[data-fav]').forEach(x=>x.onclick=e=>{e.stopPropagation();favorite(+x.dataset.fav)});
    }
    $('#search').oninput=e=>{query=e.target.value.trim().toLowerCase();render()};$('#clear').onclick=()=>{saved.selected=[];persist();render()};
    $('#copy').onclick=async()=>{const text=saved.selected.map(i=>A[i].tag).join(', ');if(!text)return toast('请先选择画风');try{await navigator.clipboard.writeText(text);toast('已复制画师串')}catch(e){prompt('复制下面的画师串',text)}};
    if(pickerMode){$('#apply').hidden=false;$('#apply').onclick=()=>{const tags=saved.selected.map(i=>A[i].tag);if(!tags.length)return toast('请先选择画风');const target=window.parent!==window?window.parent:window.opener;if(!target)return toast('没有找到发起选择的游戏卡');target.postMessage({type:'hbook-style:selected',version:1,nonce:pickerNonce,tags},'*');toast('已应用到游戏卡')}}
    render();
  </script>
</body>
</html>
